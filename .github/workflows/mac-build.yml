name: Build QuickKey AI OpenFX for Apple Silicon
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'Info.plist.in'
      - '.github/workflows/mac-build.yml'
jobs:
  build-mac-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout QuickKey source
        uses: actions/checkout@v4
      - name: Fetch OpenFX SDK and EXR decoder
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git third_party/openfx
          git clone --depth 1 --branch release https://github.com/syoyo/tinyexr.git third_party/tinyexr
      - name: Static tests
        run: python3 scripts/test_static.py
      - name: Verify worker script and output markers
        run: |
          bash -n scripts/quickkey-worker.sh
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/cache"
          printf 'test' > "$tmp/source.mov"
          cat > "$tmp/fake-engine" <<'SH'
          #!/bin/bash
          set -e
          out=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "--output" ]; then out="$2"; shift 2; else shift; fi
          done
          mkdir -p "$out/test_cutout_exr"
          touch "$out/test_cutout_exr/test_cutout.1001.exr"
          SH
          chmod +x "$tmp/fake-engine"
          bash scripts/quickkey-worker.sh "$tmp/fake-engine" "$tmp/source.mov" "$tmp/cache" 0.5
          test -e "$tmp/cache/.quickkey_ready"
          test ! -e "$tmp/cache/.quickkey_running"
          test -e "$tmp/cache/quickkey.log"
          rm -rf "$tmp"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build --config Release -j 2
      - name: Smoke-test macOS dynamic loader
        run: |
          python3 - <<'PY'
          import ctypes
          from pathlib import Path
          binary = Path("build/bundles/QuickKeyAI.ofx.bundle/Contents/MacOS/QuickKeyAI.ofx")
          print("Loading OpenFX binary:", binary)
          plug = ctypes.CDLL(str(binary.resolve()))
          plug.OfxGetNumberOfPlugins.restype = ctypes.c_int
          count = plug.OfxGetNumberOfPlugins()
          print("Exported OpenFX plugins:", count)
          assert count == 1
          print("macOS dlopen succeeded (Resolve host compatibility is not proven).")
          PY
      - name: Inspect binary
        run: |
          file build/bundles/QuickKeyAI.ofx.bundle/Contents/MacOS/QuickKeyAI.ofx
          lipo -info build/bundles/QuickKeyAI.ofx.bundle/Contents/MacOS/QuickKeyAI.ofx
      - name: Ad hoc sign plugin
        run: |
          codesign --force --sign - --timestamp=none build/bundles/QuickKeyAI.ofx.bundle/Contents/MacOS/QuickKeyAI.ofx
          codesign --verify build/bundles/QuickKeyAI.ofx.bundle/Contents/MacOS/QuickKeyAI.ofx
      - name: Package Mac installer (unsigned)
        run: |
          mkdir -p pkgroot/Library/OFX/Plugins dist
          cp -R build/bundles/QuickKeyAI.ofx.bundle pkgroot/Library/OFX/Plugins/
          pkgbuild --root pkgroot --install-location / \
            --identifier org.quickkeyai.mac.ai --version 0.2 \
            dist/QuickKeyAI-V2-Native-unsigned.pkg
          ditto -c -k --keepParent build/bundles/QuickKeyAI.ofx.bundle dist/QuickKeyAI-V2-Native-bundle.zip
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quickkey-ai-native-mac
          path: dist/*
          if-no-files-found: error
